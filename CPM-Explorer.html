<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
/* CC BY-NC-SA 4.0 https://creativecommons.org/licenses/by-nc-sa/4.0/ */

:root {
  color-scheme: dark;
  --bg: #070b12;
  --panel: #0e1521;
  --panel-2: #121c2b;
  --line: #243247;
  --text: #ecf2f8;
  --muted: #95a4b7;
  --blue: #4689cd;
  --red: #da4c4a;
  --gold: #ffcd4c;
  --green: #67d3a4;
  --warn: #f4a261;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); overflow: hidden; }
button, input, select { font: inherit; }
button, select, input[type="number"], input.sim-name {
  color: var(--text);
  background: #152235;
  border: 1px solid var(--line);
  border-radius: 9px;
}
button { padding: 7px 10px; cursor: pointer; }
button:hover { border-color: #426184; background: #1b2c43; }
button.primary { background: #2a6c8f; border-color: #3f91bb; }
select, input[type="number"] { padding: 6px 8px; min-width: 0; }

.app {
  display: grid;
  grid-template-columns: minmax(310px, 390px) minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
  height: 100%;
  transition: grid-template-columns .2s ease;
}
.app.panel-collapsed { grid-template-columns: 0 minmax(0, 1fr); }

.topbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 67px;
  padding: 9px 13px;
  border-bottom: 1px solid var(--line);
  background: #0a1019;
  flex-wrap: wrap;
}
.brand { margin-right: 8px; }
.brand h1 { margin: 0; font-size: 18px; letter-spacing: .01em; }
.brand p { margin: 1px 0 0; color: var(--muted); font-size: 11px; }
.preset-tools, .global-actions, .file-actions { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
.preset-tools label { color: var(--muted); font-size: 12px; }
.preset-tools select { max-width: 250px; }
.file-actions { margin-left: auto; }
.exit-button { display: inline-flex; align-items: center; gap: 6px; color: #f1b0ab; background: #2a2023; border-color: #684044; }
.exit-button:hover { color: #ffd0cb; background: #42272c; border-color: #b45d60; }
.exit-button svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
.exit-button:focus-visible { outline: 2px solid #ff9d89; outline-offset: 2px; }
.statusbar { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; display: flex; gap: 16px; align-items: center; min-height: 29px; padding: 5px 13px; border-top: 1px solid var(--line); background: #0a1019; color: var(--muted); font-size: 11px; }
.statusbar output + output { padding-left: 16px; border-left: 1px solid var(--line); }
.pill { padding: 1px 6px; border-radius: 99px; background: rgba(255,255,255,.12); }
.icon-button { min-width: 34px; padding: 6px 8px; }
.toolbar-button, .icon-button { display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
.toolbar-button svg, .icon-button svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.toolbar-button:disabled { cursor: not-allowed; opacity: .5; }

.sidebar {
  min-width: 0;
  overflow: hidden;
  border-right: 1px solid var(--line);
  background: var(--panel);
  display: flex;
  flex-direction: column;
}
.panel-collapsed .sidebar { visibility: hidden; }
.sidebar-head { padding: 9px 16px 8px; border-bottom: 1px solid var(--line); }
.sidebar-title-row { display: flex; align-items: baseline; gap: 7px; }
.sidebar-head span { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .1em; }
.sidebar-head h2 { font-size: 13px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-head p { color: var(--muted); font-size: 11px; margin: 0; }
#module-editor { padding: 12px; overflow: auto; scrollbar-gutter: stable; }

.module-slot {
  padding: 11px;
  margin-bottom: 10px;
  background: rgba(255,255,255,.025);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.slot-heading { margin-bottom: 8px; }
.slot-heading h3 { margin: 0; font-size: 13px; }
.slot-heading p { margin: 2px 0 0; color: var(--muted); font-size: 10px; line-height: 1.35; }
.module-picker { width: 100%; }
.module-option { margin-top: 7px; padding: 7px; border: 1px solid transparent; border-radius: 9px; }
.module-option.selected { border-color: #35516f; background: rgba(62,104,145,.12); }
.module-option > label { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; }
.module-option b { display: block; font-size: 12px; }
.module-option small { display: block; color: var(--muted); font-size: 10px; line-height: 1.3; margin-top: 2px; }
.parameter-grid { display: grid; gap: 6px; margin-top: 9px; }
.parameter-presets {
  margin: 1px 0 5px; padding: 7px; border: 1px solid #2a3d54;
  border-radius: 8px; background: rgba(61,104,145,.08);
}
.parameter-presets h4 { margin: 0 0 6px; color: #d7e1eb; font-size: 10px; }
.parameter-preset-actions { display: flex; flex-wrap: wrap; gap: 4px; }
.parameter-preset-actions button { padding: 4px 6px; font-size: 9px; }
.parameter-subheading {
  margin: 7px 0 1px; color: #c8d4df; font-size: 9px; font-weight: 650;
  letter-spacing: .06em; text-transform: uppercase;
}
.parameter { display: grid; grid-template-columns: minmax(0, 1fr) minmax(92px, 125px); align-items: center; gap: 8px; }
.parameter > span { color: #b5c2d1; font-size: 10px; }
.parameter input[type="checkbox"] { justify-self: end; }
.parameter select, .parameter input { width: 100%; font-size: 11px; }
.no-parameters { color: var(--muted); font-size: 10px; margin: 0; }
.matrix-view { margin: 2px 0 7px; }
.matrix-view h4 { margin: 0 0 5px; color: #d7e1eb; font-size: 10px; }
.matrix-scroll { overflow-x: auto; padding-bottom: 2px; }
.parameter-matrix {
  width: 100%; min-width: 260px; border-collapse: separate; border-spacing: 3px;
  table-layout: fixed; font-size: 9px;
}
.parameter-matrix th { color: var(--muted); font-weight: 600; text-align: center; }
.parameter-matrix th.matrix-corner { width: 68px; font-size: 8px; line-height: 1.2; }
.parameter-matrix th[scope="row"] { text-align: right; padding-right: 4px; }
.parameter-matrix td {
  height: 31px; padding: 0; text-align: center; border: 1px solid #26384d;
  border-radius: 6px; background: rgba(255,255,255,.025); overflow: hidden;
}
.parameter-matrix td[data-sign="positive"] { background: rgba(64,145,205,.18); border-color: rgba(83,166,226,.35); }
.parameter-matrix td[data-sign="negative"] { background: rgba(220,88,82,.16); border-color: rgba(232,105,97,.34); }
.parameter-matrix td[data-sign="null"] { color: #657488; background: rgba(255,255,255,.012); }
.matrix-input {
  width: 100%; height: 29px; min-width: 0 !important; padding: 3px !important;
  border: 0 !important; border-radius: 5px !important; background: transparent !important;
  color: inherit; text-align: center; font-size: 9px !important; font-variant-numeric: tabular-nums;
}
.matrix-value { font-variant-numeric: tabular-nums; }
.matrix-note { margin: 4px 1px 0; color: var(--muted); font-size: 8px; line-height: 1.35; }

.workspace { position: relative; min-width: 0; min-height: 0; overflow: auto; padding: 36px 12px 45px; }
.legend {
  position: absolute; z-index: 2; top: 9px; left: 18px;
  display: flex; gap: 14px; align-items: center; color: var(--muted); font-size: 10px;
}
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; display: inline-block; border-radius: 50%; }
.legend .follower { background: var(--blue); }
.legend .leader { background: var(--red); }
.legend .activity { background: var(--gold); }
.legend .g1 { background: #4091d6; }
.legend .sg2m { background: #f5b742; }
.legend .apoptotic { background: #943dbe; }
.legend .chart-key i:first-child { background: #f59e7a; }
.legend .chart-key i:last-child { background: #7cc7ff; }

.sim-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 630px), 1fr));
  align-content: start;
  gap: 12px;
}
.sim-grid.expanded { grid-template-columns: 1fr; height: 100%; }
.sim-grid.expanded .sim-body { min-height: max(520px, calc(100vh - 210px)); }
.sim-tile {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  background: var(--panel);
  box-shadow: 0 12px 40px rgba(0,0,0,.18);
}
.sim-tile.selected { border-color: #4e8db7; box-shadow: 0 0 0 1px rgba(78,141,183,.3); }
.sim-tile.dirty { border-style: dashed; }
.sim-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 9px; border-bottom: 1px solid var(--line); }
.sim-header > div:first-child { min-width: 0; flex: 1; }
.sim-name { width: min(100%, 390px); border-color: transparent; background: transparent; padding: 3px 4px; font-weight: 650; }
.sim-name:focus { border-color: var(--line); background: #101b2a; outline: none; }
.sim-status { display: block; padding: 2px 4px; color: var(--muted); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sim-status[data-kind="error"] { color: #ff8d8d; }
.sim-status[data-kind="dirty"] { color: #b9dcf1; }
.sim-status[data-kind="ok"] { color: var(--green); }
.sim-actions { display: flex; gap: 4px; }
.sim-actions button { font-size: 13px; }
.sim-body { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(210px, 280px); min-height: 380px; }
.canvas-wrap { position: relative; min-width: 0; min-height: 380px; background: #080d15; overflow: hidden; }
.canvas-viewport { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; outline: none; }
.canvas-viewport:active { cursor: grabbing; }
.canvas-viewport:focus-visible { box-shadow: inset 0 0 0 2px #4e8db7; }
.canvas-stage { position: absolute; inset: 0; pointer-events: none; }
.lattice-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
.canvas-loading { position: absolute; inset: 0; display: grid; place-content: center; color: #a8b7ca; font-size: 13px; }
.canvas-loading[hidden] { display: none; }
.sim-canvas { display: block; width: 100%; height: 100%; image-rendering: auto; }
.view-toolbar {
  position: absolute; z-index: 4; top: 9px; right: 9px; display: flex; align-items: center;
  gap: 3px; padding: 4px; border: 1px solid rgba(118,146,175,.32); border-radius: 9px;
  background: rgba(8,13,21,.86); backdrop-filter: blur(7px);
}
.view-toolbar button { min-width: 29px; padding: 4px 6px; border-radius: 6px; font-size: 10px; }
.view-scale { min-width: 42px; color: #b8c8d7; text-align: center; font-size: 9px; font-variant-numeric: tabular-nums; }
.canvas-note { position: absolute; left: 12px; bottom: 10px; color: rgba(230,238,246,.55); font-size: 9px; background: rgba(3,8,14,.72); padding: 3px 6px; border-radius: 6px; }
.diagnostics { min-width: 0; padding: 10px; border-left: 1px solid var(--line); background: var(--panel-2); }
.module-badges { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 9px; }
.module-badges span { padding: 2px 5px; background: rgba(107,148,186,.12); border: 1px solid rgba(107,148,186,.22); border-radius: 99px; color: #aac4da; font-size: 8px; }
.metrics { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 10px; margin: 0; font-size: 10px; }
.metrics dt { color: var(--muted); }
.metrics dd { margin: 0; color: var(--text); font-variant-numeric: tabular-nums; text-align: right; }
.metric-chart { display: block; width: 100%; height: 54px; margin-top: 3px; }
.metric-plot-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 9px; margin-top: 4px; color: var(--muted); font-size: 9px; }
.metric-plot-controls > span { color: #a9bed0; }
.metric-plot-controls label { display: inline-flex; align-items: center; gap: 3px; }
.metric-plot-controls input { margin: 0; accent-color: #70afe0; }
.single-cell-plots { font-size: 10px; color: var(--muted); }
.single-cell-plots[hidden] { display: none; }
.single-cell-plots canvas { display: block; width: 100%; height: 118px; margin: 3px 0 8px; }
.single-cell-note { line-height: 1.5; }
.single-cell-plots button { width: 100%; margin-top: 6px; }
.single-cell-plots select { width: 100%; margin: 4px 0 8px; }
.chart-label[hidden] { display: none; }
.migration-export-dialog { width: min(720px, 90vw); color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.migration-export-dialog::backdrop { background: #0009; }
.migration-export-dialog form { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.migration-export-dialog a { color: #7cc7ff; }
.migration-export-dialog textarea { width: 100%; height: 45vh; resize: vertical; background: #080d15; color: #bdcede; font: 11px monospace; }
.chart-label { display: flex; justify-content: space-between; color: var(--muted); font-size: 8px; margin-top: 10px; }
.chart-label span:first-child { color: #f59e7a; }
.chart-label span:last-child { color: #7cc7ff; }

@media (max-width: 1020px) {
  body { overflow: auto; }
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto minmax(600px, 1fr) auto; height: auto; min-height: 100%; }
  .app.panel-collapsed { grid-template-columns: 1fr; grid-template-rows: auto 0 minmax(600px, 1fr); }
  .topbar { grid-column: 1; }
  .sidebar { grid-row: 2; max-height: 55vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .workspace { grid-row: 3; min-height: 650px; }
}

@media (max-width: 700px) {
  .topbar { align-items: flex-start; }
  .file-actions { margin-left: 0; }
  .sim-body { grid-template-columns: 1fr; }
  .diagnostics { border-left: 0; border-top: 1px solid var(--line); }
  .sim-actions { flex-wrap: wrap; justify-content: flex-end; }
}

/* CC BY-NC-SA 4.0 https://creativecommons.org/licenses/by-nc-sa/4.0/ */
.view-settings { margin: 6px 0; border: 1px solid #334155; border-radius: 8px; }
.view-settings > summary, .advanced-coordinates > summary { cursor: pointer; padding: 10px; font-weight: 600; }
.visualization-editor { padding: 0 10px; max-height: 320px; overflow: auto; }
.brush-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 6px 0; }
.brush-toolbar label { display: flex; align-items: center; gap: 4px; font-size: 12px; }
.brush-toolbar input { width: 62px; }
.brush-toolbar small { width: 100%; color: #94a3b8; font-size: 11px; }
.initial-choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.initial-choice { padding: 6px; white-space: normal; text-align: left; }
.initial-choice svg { display: block; width: 100%; }
.initial-choice span { display: block; font-size: 11px; margin-top: 5px; }
.initial-choice[aria-pressed="true"] { border-color: #60a5fa; background: #1c3550; }
.initial-choice:disabled { opacity: .4; cursor: not-allowed; }
.advanced-coordinates { grid-column: 1 / -1; }
.parameter-matrix .matrix-input { min-width: 54px; padding: 8px 2px; border: 1px solid #50647b; border-radius: 4px; }
.canvas-wrap { display: flex; flex-direction: column; }
.canvas-wrap > .view-toolbar { position: relative; inset: auto; align-self: flex-end; margin: 8px; }
.canvas-wrap > .view-settings { margin: 0 8px 6px; flex: none; }
.canvas-wrap > .brush-toolbar { padding: 6px 8px; flex: none; }
.canvas-wrap > .canvas-viewport { position: relative; inset: auto; flex: 1; min-height: 360px; }
.canvas-wrap > .canvas-note { position: relative; inset: auto; align-self: flex-start; margin: 6px 8px; }

/* Compact overlay menu: opening it never changes canvas size or zoom. */
.canvas-wrap > .view-toolbar { overflow: visible; z-index: 4; }
.view-toolbar .view-settings { position: relative; margin: 0; border: 0; }
.view-settings > summary { padding: 5px 8px; font-size: 11px; list-style: none; white-space: nowrap; }
.view-settings > summary::-webkit-details-marker { display: none; }
.view-settings .visualization-editor {
  position: absolute; right: 0; top: calc(100% + 8px); width: 246px;
  max-width: calc(100vw - 40px); max-height: 360px; padding: 8px;
  background: #111c29; border: 1px solid #3b5067; border-radius: 8px;
  box-shadow: 0 8px 24px #0008; z-index: 10;
}
.view-menu-row { display: flex; align-items: center; gap: 8px; min-height: 31px; font-size: 11px; }
.view-menu-row > span { width: 47px; flex: none; color: #aabacc; }
.view-menu-row label { display: flex; align-items: center; gap: 3px; white-space: nowrap; }
.view-menu-row input[type="radio"] { margin: 0; width: 12px; height: 12px; accent-color: #71b9f0; }
.view-menu-row input[type="range"] { width: 162px; min-width: 0; accent-color: #71b9f0; }

/* Task-oriented inspector, CC BY-NC-SA 4.0. */
.editor-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin: 14px 0 10px; }
.editor-tabs button { padding: 8px 3px; border: 0; border-radius: 4px; background: transparent; color: #a6b6c8; font-size: 12px; }
.editor-tabs button[aria-selected="true"] { color: #e8f4ff; background: #243a50; box-shadow: inset 0 -2px #74b5e7; }
#parameter-search { width: 100%; font-size: 12px; padding: 8px 10px; }
.setup-actions { display: flex; align-items: center; gap: 6px; margin-top: 9px; }
.setup-actions output { flex: 1; color: #91a7b9; font-size: 11px; }
.setup-actions button { font-size: 11px; padding: 6px 9px; }
#module-editor { padding: 0 12px 16px; }
#module-editor .module-slot { background: transparent; border: 0; border-bottom: 1px solid #263544; border-radius: 0; padding: 12px 0; margin: 0; }
#module-editor summary.slot-heading { cursor: pointer; font-size: 13px; font-weight: 600; margin: 0; padding: 3px 0; }
#module-editor details[open] > summary.slot-heading { margin-bottom: 10px; }
.help-button { float: right; width: 21px; padding: 0; border: 0; color: #9bb3c7; background: transparent; }
.context-help { font-size: 11px; color: #94a9ba; line-height: 1.5; }
.module-option, .module-option.selected { border: 0; background: none; border-radius: 0; padding: 8px 0; margin: 0; }
.module-option > label { align-items: center; font-size: 12px; }
.parameter-grid { gap: 9px; margin: 10px 0 4px; }
.parameter { grid-template-columns: minmax(0,1fr) 95px 20px; gap: 5px; min-height: 30px; }
.parameter > span { font-size: 11px; line-height: 1.35; }
.parameter input, .parameter select { padding: 5px 7px; font-size: 12px; border-radius: 4px; }
.pin-parameter { padding: 0; border: 0; background: transparent; color: #8aa3b8; font-size: 16px; }
.pin-parameter[aria-pressed="true"] { color: #e5bd69; }
.pinned-controls { border-bottom: 1px solid #405165; padding: 12px 0; }
.pinned-controls summary { font-size: 12px; cursor: pointer; margin-bottom: 8px; }
.inline-choices { display: flex; flex-wrap: wrap; gap: 9px; margin: 8px 0; }
.inline-choices label { display: flex; align-items: center; gap: 4px; font-size: 11px; }
.inline-choices input { accent-color: #70afe0; margin: 0; }
.initial-choice svg { max-height: 78px; }
.initial-choice { background: #14202d; border-radius: 5px; }
.initial-choice span { font-size: 11px; }
.initial-choice[aria-pressed="true"] { background: #21374a; }
.type-profile-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.type-profile-table th { text-align: left; font-weight: 400; color: #aebfce; }
.type-profile-table th, .type-profile-table td { padding: 7px 4px; border-bottom: 1px solid #253443; }
.type-profile-table input { width: 90px; padding: 5px; }
.cell-selection-info { font-size: 12px; line-height: 1.6; color: #abc5d9; }
.cell-inspector-actions { display: grid; gap: 8px; }
.cell-inspector-actions label { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
.cell-inspector-actions input { width: 100px; }
.cell-quick-card {
  position: absolute; z-index: 4; max-width: 220px; padding: 3px 6px; pointer-events: none;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: #e8f4ff; background: rgba(13,25,38,.96); border: 1px solid #5b87a8;
  border-radius: 4px; box-shadow: 0 2px 8px #0008; font-size: 9px;
  line-height: 1.25; font-variant-numeric: tabular-nums;
}
.cell-quick-card strong { font-size: 9px; }
.cell-quick-card span { color: #b9cede; margin-left: 4px; }
.brush-footprint { position: absolute; z-index: 3; pointer-events: none; border: 1px solid white; box-shadow: 0 0 0 1px #111; border-radius: 50%; transform: translate(-50%, -50%); }
.brush-hint { width: 100%; font-size: 10px; color: #8da5b8; }
.technical-details { margin-bottom: 8px; }
.technical-details summary { font-size: 10px; color: #8da5b8; cursor: pointer; }
.energy-choice { margin: 8px 0 10px; }
.energy-choice > label { display: grid; gap: 4px; color: #b5c2d1; font-size: 11px; }
.energy-choice .context-help { margin: 6px 0 0; }
.advanced-terms { margin-top: 8px; }
.advanced-terms > summary { color: #9eb4c7; cursor: pointer; font-size: 10px; }
.pending { border-color: #79bce5; background: #203d53; }
